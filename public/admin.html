<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - World Visa Express</title><link rel="stylesheet" href="style.css"><style>.admin{padding:50px 0}.panel{background:#fff;border:1px solid #e1e8f1;border-radius:18px;padding:25px;box-shadow:0 10px 30px #0b305c12;margin-bottom:22px}.admin table{width:100%;border-collapse:collapse}.admin th,.admin td{padding:12px;border-bottom:1px solid #e8eef5;text-align:left}.admin input,.admin select{padding:9px;border:1px solid #ccd8e5;border-radius:8px}.login{max-width:420px;margin:80px auto}.hidden{display:none}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><img src="logo.png"></a><a href="/">← Website</a></div></header><main class="admin container"><div id="login" class="panel login"><h2>Admin Login</h2><input id="user" placeholder="Username" style="width:100%;margin:8px 0"><input id="pass" type="password" placeholder="Password" style="width:100%;margin:8px 0"><button class="btn primary" onclick="login()">Login</button><p id="err"></p></div><div id="dashboard" class="hidden">
<div class="panel">
<h2>Admin Dashboard</h2>
<p style="color:#667085">Application management</p>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0">
<div><b>Total</b><div id="total" style="font-size:26px">0</div></div>
<div><b>Pending</b><div id="pending" style="font-size:26px">0</div></div>
<div><b>Processing</b><div id="processing" style="font-size:26px">0</div></div>
<div><b>Approved</b><div id="approved" style="font-size:26px">0</div></div>
</div>
<input id="search" placeholder="Search ID, name, phone or country" style="padding:10px;width:min(520px,100%);border:1px solid #ccd8e5;border-radius:8px;margin:5px 0" oninput="renderApps()">
<select id="filter" onchange="renderApps()" style="padding:10px;border:1px solid #ccd8e5;border-radius:8px;margin:5px">
<option value="">All Status</option><option>Pending</option><option>Processing</option><option>Approved</option><option>Rejected</option>
</select>
<button class="btn primary" onclick="loadApps()">Refresh</button> <button class="btn secondary" style="color:#123" onclick="logout()">Logout</button></div><div class="panel" style="overflow:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Country</th><th>Visa</th><th>Phone</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});let d=await r.json();if(r.ok){loginEl=document.getElementById('login');loginEl.classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadApps()}else err.textContent=d.error}async function loadApps(){let r=await fetch('/api/admin/applications');if(r.status===401)return;apps=await r.json();updateStats();renderApps()}
let apps=[];
function updateStats(){total.textContent=apps.length;pending.textContent=apps.filter(x=>x.status==='Pending').length;processing.textContent=apps.filter(x=>x.status==='Processing').length;approved.textContent=apps.filter(x=>x.status==='Approved').length}
function renderApps(){let q=(search.value||'').toLowerCase(),f=filter.value;let a=apps.filter(x=>(!f||x.status===f)&&(!q||[x.applicationId,x.name,x.phone,x.country,x.visa].join(' ').toLowerCase().includes(q)));rows.innerHTML=a.map(x=>`<tr><td>${x.applicationId}</td><td>${x.name}</td><td>${x.country}</td><td>${x.visa}</td><td>${x.phone}</td><td>${new Date(x.createdAt).toLocaleDateString('en-GB')}</td><td><select id="s-${x.applicationId}">${['Pending','Processing','Approved','Rejected'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn primary" onclick="updateStatus('${x.applicationId}')">Save</button></td></tr>`).join('')||'<tr><td colspan="8">কোনো আবেদন পাওয়া যায়নি</td></tr>'}
async function updateStatus(id){let status=document.getElementById('s-'+id).value;let r=await fetch('/api/admin/applications/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(r.ok)loadApps();else alert('Update failed')}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}</script></body></html>
